name: flyrank-capstone-social-studio
track: backend
language: python
framework: django

run: docker compose up --build
seed: docker compose exec web python manage.py seed_demo
test: docker compose exec web python manage.py test

base_url: http://localhost:8000

endpoints:
  health: GET /api/health/
  create_campaign: POST /api/campaigns/
  campaign_detail: GET /api/campaigns/{id}/
  list_campaigns: GET /api/campaigns/
  delivery_webhook: POST /api/webhook/social-delivery/
  fake_oauth: POST /fake/oauth/token/
  fake_publish: POST /fake/{platform}/publish/          # platform = instagram | x

notes: >
  Everything runs against fake_platform, this repo's own simulated social
  platform -- the starters/challenge-5-social/ link from the brief was
  unreachable, so an equivalent contract was built and documented in
  FAKE_PLATFORM_CONTRACT.md. Runs via Docker Compose: Postgres + Redis +
  three app containers (web, worker, beat). Local dev without Docker is
  also supported (SQLite + filesystem Celery broker via
  `python manage.py runstack`) -- see README.